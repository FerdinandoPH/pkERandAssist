<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente de mapa - Esmeralda Warp Rando</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <aside id="panel">
    <header>
      <h1>Esmeralda <span>Warp Rando</span></h1>
      <div id="link-status" class="status offline">emulador sin conectar</div>
    </header>

    <section id="current">
      <h2>Ahora mismo</h2>
      <p class="map-name" id="current-map">-</p>
      <p class="muted" id="current-pos"></p>
    </section>

    <section>
      <h2>Progreso</h2>
      <dl class="stats">
        <div><dt>Zonas</dt><dd id="stat-zones">0</dd></div>
        <div><dt>Mapas</dt><dd id="stat-maps">0</dd></div>
        <div><dt>Puertas</dt><dd id="stat-doors">0</dd></div>
        <div><dt>Confirmadas</dt><dd id="stat-both">0</dd></div>
      </dl>
    </section>

    <section id="selection" hidden>
      <h2>Seleccion</h2>
      <p class="map-name" id="sel-name">-</p>
      <p class="muted" id="sel-zone"></p>
      <ul id="sel-warps" class="warps"></ul>
    </section>

    <section id="pending-box">
      <h2>Puertas sin probar <span id="pending-count" class="badge">0</span></h2>
      <ul id="pending-list" class="pending"></ul>
    </section>

    <section>
      <h2>Vista</h2>
      <label class="toggle">
        <input type="checkbox" id="opt-reveal"> Revelar todo el mapa
      </label>
      <label class="toggle">
        <input type="checkbox" id="opt-links" checked> Dibujar conexiones
      </label>
      <label class="toggle">
        <input type="checkbox" id="opt-follow" checked> Seguir al jugador
      </label>
      <button id="btn-fit">Ver todo</button>
      <button id="btn-export">Exportar</button>
    </section>

    <footer>
      <p class="muted">Rueda para acercar, arrastra para mover.</p>
    </footer>
  </aside>

  <div id="tooltip" hidden></div>
  <div id="error" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
