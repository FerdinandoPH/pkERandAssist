<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente de mapa - Esmeralda Warp Rando</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <aside id="panel">
    <header>
      <h1>Esmeralda <span>Warp Rando</span></h1>
      <div id="link-status" class="status offline">emulador sin conectar</div>
    </header>

    <section id="run-box">
      <h2>Partida</h2>
      <select id="run-select"></select>
      <p class="muted" id="run-progress"></p>
      <div class="row">
        <button id="btn-run-new">Nueva</button>
        <button id="btn-run-rename">Renombrar</button>
        <button id="btn-run-delete">Borrar</button>
      </div>
      <div class="row">
        <button id="btn-run-import">Importar</button>
        <button id="btn-run-save">Guardar copia</button>
      </div>
      <input type="file" id="run-file" accept="application/json" hidden>
    </section>

    <section id="current">
      <h2>Ahora mismo</h2>
      <p class="map-name" id="current-map">-</p>
      <p class="muted" id="current-pos"></p>
    </section>

    <section>
      <h2>Progreso</h2>
      <dl class="stats">
        <div><dt>Zonas</dt><dd id="stat-zones">0</dd></div>
        <div><dt>Mapas</dt><dd id="stat-maps">0</dd></div>
        <div><dt>Puertas</dt><dd id="stat-doors">0</dd></div>
        <div><dt>Confirmadas</dt><dd id="stat-both">0</dd></div>
      </dl>
    </section>

    <section id="selection" hidden>
      <h2>Seleccion</h2>
      <p class="map-name" id="sel-name">-</p>
      <p class="muted" id="sel-zone"></p>
      <ul id="sel-warps" class="warps"></ul>
    </section>

    <section id="pending-box">
      <h2>Puertas sin probar <span id="pending-count" class="badge">0</span></h2>
      <ul id="pending-list" class="pending"></ul>
    </section>

    <section>
      <h2>Vista</h2>
      <label class="field">
        <span>Modo del mapa</span>
        <select id="opt-mode">
          <option value="explore">Exploracion</option>
          <option value="world">Mundo visible</option>
        </select>
      </label>
      <label class="toggle">
        <input type="checkbox" id="opt-links"> Dibujar conexiones
      </label>
      <button id="btn-follow" class="toggle-btn" aria-pressed="true">Seguir al jugador</button>
      <button id="btn-fit">Ver todo</button>
      <button id="btn-export">Exportar</button>
    </section>

    <footer>
      <p class="muted">Rueda para acercar, arrastra para mover.</p>
    </footer>
  </aside>

  <div id="tooltip" hidden></div>
  <div id="error" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
